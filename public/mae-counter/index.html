<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a0a1a">
  <title>Contador da Afilhada 👧</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      background: #0a0a1a;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      color: #fff;
      overflow: hidden;
      position: relative;
      padding: 20px;
    }

    /* Background glow effect */
    body::before {
      content: '';
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(ellipse at center, rgba(255, 100, 150, 0.08) 0%, transparent 60%);
      pointer-events: none;
    }

    .app {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      width: 100%;
      max-width: 380px;
    }

    .title {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.35);
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 1rem;
      color: rgba(255,255,255,0.5);
      margin-bottom: 32px;
    }

    /* Counter */
    .counter-wrap {
      position: relative;
      margin-bottom: 12px;
    }

    .counter {
      font-size: clamp(7rem, 30vw, 10rem);
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(135deg, #ff6b9d, #ffb347, #ff6b9d);
      background-size: 200% 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
      display: block;
      text-align: center;
      animation: gradientShift 4s ease infinite;
    }

    @keyframes gradientShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    .counter.pop {
      transform: scale(1.35);
    }

    /* Ripple on score */
    .ripple {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 200px;
      height: 200px;
      transform: translate(-50%, -50%) scale(0);
      border-radius: 50%;
      background: rgba(255, 107, 157, 0.3);
      animation: rippleOut 0.6s ease-out forwards;
      pointer-events: none;
    }

    @keyframes rippleOut {
      to { transform: translate(-50%, -50%) scale(4); opacity: 0; }
    }

    .counter-label {
      text-align: center;
      font-size: 0.85rem;
      color: rgba(255,255,255,0.3);
      margin-bottom: 44px;
      letter-spacing: 0.5px;
    }

    /* Main button */
    .btn-main {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 0.1s, box-shadow 0.2s;
      position: relative;
      outline: none;
      -webkit-appearance: none;
    }

    .btn-main:active { transform: scale(0.94); }

    .btn-main .icon { font-size: 2.5rem; line-height: 1; }
    .btn-main .label { font-size: 0.95rem; font-weight: 700; letter-spacing: 0.5px; }

    .btn-main.start {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      box-shadow: 0 0 50px rgba(102, 126, 234, 0.5), 0 0 100px rgba(102, 126, 234, 0.2);
    }

    .btn-main.stop {
      background: linear-gradient(135deg, #ff6b9d, #c44569);
      color: white;
      box-shadow: 0 0 50px rgba(255, 107, 157, 0.6), 0 0 100px rgba(255, 107, 157, 0.2);
    }

    /* Pulse ring when listening */
    .btn-main.stop::before {
      content: '';
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 2px solid rgba(255, 107, 157, 0.4);
      animation: ringPulse 1.5s ease-in-out infinite;
    }

    .btn-main.stop::after {
      content: '';
      position: absolute;
      inset: -16px;
      border-radius: 50%;
      border: 1px solid rgba(255, 107, 157, 0.2);
      animation: ringPulse 1.5s ease-in-out infinite 0.4s;
    }

    @keyframes ringPulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.06); opacity: 0.4; }
    }

    /* Status */
    .status {
      margin-top: 28px;
      font-size: 0.85rem;
      color: rgba(255,255,255,0.4);
      text-align: center;
      min-height: 22px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ff6b9d;
      flex-shrink: 0;
      animation: dotBlink 1s ease-in-out infinite;
    }

    @keyframes dotBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }

    .last-word {
      margin-top: 10px;
      font-size: 0.8rem;
      color: rgba(255,255,255,0.25);
      min-height: 18px;
      font-style: italic;
      text-align: center;
    }

    /* Bottom controls */
    .bottom {
      margin-top: 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: 100%;
    }

    .btn-reset {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.35);
      padding: 10px 28px;
      border-radius: 24px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.5px;
    }

    .btn-reset:active { opacity: 0.5; transform: scale(0.97); }

    .wake-info {
      font-size: 0.72rem;
      color: rgba(255,255,255,0.2);
      text-align: center;
      max-width: 260px;
      line-height: 1.5;
    }

    /* Score flash overlay */
    .score-flash {
      position: fixed;
      inset: 0;
      background: rgba(255, 107, 157, 0.12);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.05s;
    }

    .score-flash.active { opacity: 1; }
  </style>
</head>
<body>

<div class="score-flash" id="flash"></div>

<div class="app">
  <div class="title">Afilhada Counter</div>
  <div class="subtitle">Quantas vezes ela disse mãe?</div>

  <div class="counter-wrap">
    <span class="counter" id="counter">0</span>
  </div>
  <div class="counter-label">vezes que disse "mãe" 😤</div>

  <button class="btn-main start" id="mainBtn" onclick="toggle()">
    <span class="icon">🎤</span>
    <span class="label">Iniciar</span>
  </button>

  <div class="status" id="status">Toque para começar</div>
  <div class="last-word" id="lastWord">&nbsp;</div>

  <div class="bottom">
    <button class="btn-reset" onclick="resetCount()">Zerar contador</button>
    <div class="wake-info" id="wakeInfo">
      Mantenha a tela ligada para funcionar melhor no iPhone
    </div>
  </div>
</div>

<script>
  // ── State ──────────────────────────────────────────────────────────────
  let count = parseInt(localStorage.getItem('maeCount') || '0');
  let recognition = null;
  let isListening = false;
  let audioCtx = null;
  let wakeLock = null;
  let restartTimer = null;

  // ── Init ───────────────────────────────────────────────────────────────
  document.getElementById('counter').textContent = count;

  // Strict: requires vowel ending — used on interim to avoid false positives mid-word
  const MAE_STRICT = /\bm[aã]+(?:[eêéiy]|nh[eêéiy]?)\b/gi;
  // Loose: ending optional — used on final to catch anything missed by interim
  const MAE_LOOSE  = /\bm[aã]+(?:[eêéiy]|nh?[eêéiy]?)?\b/gi;

  // ── Audio ──────────────────────────────────────────────────────────────
  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  function playScore() {
    initAudio();
    // Cheerful ascending 4-note arpeggio
    const freqs = [523.25, 659.25, 783.99, 1046.5]; // C5 E5 G5 C6
    freqs.forEach((f, i) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.type = 'sine';
      osc.frequency.value = f;

      const t0 = audioCtx.currentTime + i * 0.1;
      gain.gain.setValueAtTime(0, t0);
      gain.gain.linearRampToValueAtTime(0.35, t0 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.28);
      osc.start(t0);
      osc.stop(t0 + 0.3);
    });

    // Small "thwack" noise on beat 0
    const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.05, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) {
      data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
    }
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    const ng = audioCtx.createGain();
    ng.gain.value = 0.15;
    src.connect(ng);
    ng.connect(audioCtx.destination);
    src.start(audioCtx.currentTime);
  }

  // ── Counter ────────────────────────────────────────────────────────────
  function score(word) {
    count++;
    localStorage.setItem('maeCount', count);

    const el = document.getElementById('counter');
    el.textContent = count;

    // Pop animation
    el.classList.remove('pop');
    void el.offsetWidth; // reflow
    el.classList.add('pop');
    setTimeout(() => el.classList.remove('pop'), 300);

    // Ripple
    const r = document.createElement('div');
    r.className = 'ripple';
    document.querySelector('.counter-wrap').appendChild(r);
    setTimeout(() => r.remove(), 700);

    // Flash
    const flash = document.getElementById('flash');
    flash.classList.add('active');
    setTimeout(() => flash.classList.remove('active'), 120);

    document.getElementById('lastWord').textContent = `"${word.trim()}" detectado`;

    playScore();
  }

  function resetCount() {
    count = 0;
    localStorage.setItem('maeCount', 0);
    document.getElementById('counter').textContent = 0;
    document.getElementById('lastWord').textContent = ' ';
  }

  // ── Speech Recognition ─────────────────────────────────────────────────
  function buildRecognition() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return null;

    const r = new SR();
    r.lang = 'pt-BR';
    r.continuous = true;
    r.interimResults = true;
    r.maxAlternatives = 3;

    // Tracks how many times we already scored for the current utterance via interim,
    // so the final result doesn't double-count.
    let interimScored = 0;

    r.onresult = (e) => {
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const result = e.results[i];

        let combined = '';
        for (let j = 0; j < result.length; j++) combined += ' ' + result[j].transcript;

        if (!result.isFinal) {
          // Count as soon as the word is recognisably complete (strict pattern)
          const hits = combined.match(MAE_STRICT);
          const newTotal = hits ? hits.length : 0;
          if (newTotal > interimScored) {
            for (let k = interimScored; k < newTotal; k++) score(hits[k]);
            interimScored = newTotal;
          }
        } else {
          // Final: catch anything the interim strict pattern may have missed
          const hits = combined.match(MAE_LOOSE);
          const finalTotal = hits ? hits.length : 0;
          for (let k = interimScored; k < finalTotal; k++) score(hits[k]);
          interimScored = 0;
        }
      }
    };

    r.onerror = (e) => {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
        setStatus('❌ Permissão de microfone negada', false);
        stopListening();
        return;
      }
      // Ignore no-speech / aborted — onend handles restart
    };

    r.onend = () => {
      if (isListening) {
        // Auto-restart (iOS stops recognition every ~60s)
        clearTimeout(restartTimer);
        restartTimer = setTimeout(() => {
          try { recognition && recognition.start(); } catch (_) {}
        }, 300);
      }
    };

    return r;
  }

  // ── Wake Lock ──────────────────────────────────────────────────────────
  async function acquireWakeLock() {
    if (!('wakeLock' in navigator)) return;
    try {
      wakeLock = await navigator.wakeLock.request('screen');
      document.getElementById('wakeInfo').textContent =
        'Tela travada — não vai apagar enquanto estiver ouvindo ✓';
    } catch (_) {}
  }

  function releaseWakeLock() {
    if (wakeLock) { wakeLock.release(); wakeLock = null; }
    document.getElementById('wakeInfo').textContent =
      'Mantenha a tela ligada para funcionar melhor no iPhone';
  }

  // Re-acquire after page becomes visible again (e.g. app switcher)
  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState === 'visible' && isListening) {
      await acquireWakeLock();
      // Also restart recognition if it died
      try { recognition && recognition.start(); } catch (_) {}
    }
  });

  // ── UI helpers ─────────────────────────────────────────────────────────
  function setStatus(text, listening) {
    const el = document.getElementById('status');
    if (listening) {
      el.innerHTML = '<span class="dot"></span> Ouvindo...';
    } else {
      el.innerHTML = text;
    }
  }

  // ── Toggle ─────────────────────────────────────────────────────────────
  async function toggle() {
    initAudio(); // must be on user gesture for iOS
    if (isListening) {
      stopListening();
    } else {
      await startListening();
    }
  }

  async function startListening() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      setStatus('❌ Navegador não suporta reconhecimento de voz', false);
      return;
    }

    recognition = buildRecognition();
    isListening = true;

    try {
      recognition.start();
    } catch (_) {}

    await acquireWakeLock();

    const btn = document.getElementById('mainBtn');
    btn.className = 'btn-main stop';
    btn.innerHTML = '<span class="icon">⏹</span><span class="label">Parar</span>';
    setStatus('', true);
  }

  function stopListening() {
    isListening = false;
    clearTimeout(restartTimer);

    if (recognition) {
      try { recognition.stop(); } catch (_) {}
      recognition = null;
    }

    releaseWakeLock();

    const btn = document.getElementById('mainBtn');
    btn.className = 'btn-main start';
    btn.innerHTML = '<span class="icon">🎤</span><span class="label">Iniciar</span>';
    setStatus('Toque para começar', false);
  }
</script>
</body>
</html>
