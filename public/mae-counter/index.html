<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a0a1a">
  <title>Contador da Afilhada 👧</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      background: #0a0a1a;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      color: #fff;
      overflow: hidden;
      position: relative;
      padding: 20px;
    }

    body::before {
      content: '';
      position: fixed;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      background: radial-gradient(ellipse at center, rgba(255, 100, 150, 0.07) 0%, transparent 60%);
      pointer-events: none;
    }

    .app {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 380px;
    }

    /* ── Mode tabs ─────────────────────────────────────── */
    .tabs {
      display: flex;
      background: rgba(255,255,255,0.07);
      border-radius: 14px;
      padding: 4px;
      gap: 4px;
      margin-bottom: 28px;
    }

    .tab {
      padding: 8px 22px;
      border-radius: 10px;
      border: none;
      background: transparent;
      color: rgba(255,255,255,0.4);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.3px;
    }

    .tab.active {
      background: rgba(255,255,255,0.12);
      color: #fff;
    }

    /* ── Counter ───────────────────────────────────────── */
    .counter-wrap {
      position: relative;
      margin-bottom: 10px;
    }

    .counter {
      font-size: clamp(7rem, 30vw, 10rem);
      font-weight: 900;
      line-height: 1;
      display: block;
      text-align: center;
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), color 0.4s;
    }

    /* Counter mode gradient */
    .counter.mode-counter {
      background: linear-gradient(135deg, #ff6b9d, #ffb347, #ff6b9d);
      background-size: 200% 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: gradientShift 4s ease infinite;
    }

    /* Game mode — color set dynamically via JS class */
    .counter.pts-safe {
      background: linear-gradient(135deg, #43e97b, #38f9d7);
      background-size: 200% 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .counter.pts-warn {
      background: linear-gradient(135deg, #f7971e, #ffd200);
      background-size: 200% 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .counter.pts-danger {
      background: linear-gradient(135deg, #ff416c, #ff4b2b);
      background-size: 200% 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: dangerPulse 0.6s ease-in-out infinite;
    }

    @keyframes gradientShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    @keyframes dangerPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }

    .counter.pop { transform: scale(1.35) !important; }

    /* Hearts row for game mode */
    .hearts {
      display: flex;
      gap: 4px;
      justify-content: center;
      font-size: 1.2rem;
      min-height: 28px;
      margin-bottom: 6px;
      flex-wrap: wrap;
      max-width: 280px;
    }

    .heart { transition: transform 0.2s, opacity 0.2s; }
    .heart.lost { opacity: 0; transform: scale(0); }

    .counter-label {
      text-align: center;
      font-size: 0.85rem;
      color: rgba(255,255,255,0.3);
      margin-bottom: 40px;
      letter-spacing: 0.5px;
      min-height: 20px;
    }

    /* Ripple */
    .ripple {
      position: absolute;
      top: 50%; left: 50%;
      width: 200px; height: 200px;
      transform: translate(-50%, -50%) scale(0);
      border-radius: 50%;
      background: rgba(255, 107, 157, 0.3);
      animation: rippleOut 0.6s ease-out forwards;
      pointer-events: none;
    }

    .ripple.bad { background: rgba(255, 65, 108, 0.3); }

    @keyframes rippleOut {
      to { transform: translate(-50%, -50%) scale(4); opacity: 0; }
    }

    /* ── Main button ───────────────────────────────────── */
    .btn-main {
      width: 160px; height: 160px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 0.1s, box-shadow 0.2s;
      position: relative;
      outline: none;
      -webkit-appearance: none;
    }

    .btn-main:active { transform: scale(0.94); }
    .btn-main .icon { font-size: 2.5rem; line-height: 1; }
    .btn-main .label { font-size: 0.95rem; font-weight: 700; letter-spacing: 0.5px; }

    .btn-main.start {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      box-shadow: 0 0 50px rgba(102, 126, 234, 0.5), 0 0 100px rgba(102, 126, 234, 0.2);
    }

    .btn-main.stop {
      background: linear-gradient(135deg, #ff6b9d, #c44569);
      color: white;
      box-shadow: 0 0 50px rgba(255, 107, 157, 0.6), 0 0 100px rgba(255, 107, 157, 0.2);
    }

    .btn-main.stop::before {
      content: '';
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 2px solid rgba(255, 107, 157, 0.4);
      animation: ringPulse 1.5s ease-in-out infinite;
    }

    .btn-main.stop::after {
      content: '';
      position: absolute;
      inset: -16px;
      border-radius: 50%;
      border: 1px solid rgba(255, 107, 157, 0.2);
      animation: ringPulse 1.5s ease-in-out infinite 0.4s;
    }

    @keyframes ringPulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.06); opacity: 0.4; }
    }

    /* ── Status / last word ────────────────────────────── */
    .status {
      margin-top: 28px;
      font-size: 0.85rem;
      color: rgba(255,255,255,0.4);
      text-align: center;
      min-height: 22px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #ff6b9d;
      flex-shrink: 0;
      animation: dotBlink 1s ease-in-out infinite;
    }

    @keyframes dotBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }

    .last-word {
      margin-top: 10px;
      font-size: 0.8rem;
      color: rgba(255,255,255,0.25);
      min-height: 18px;
      font-style: italic;
      text-align: center;
    }

    /* ── Bottom ────────────────────────────────────────── */
    .bottom {
      margin-top: 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: 100%;
    }

    .btn-reset {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.35);
      padding: 10px 28px;
      border-radius: 24px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.5px;
    }

    .btn-reset:active { opacity: 0.5; transform: scale(0.97); }

    .wake-info {
      font-size: 0.72rem;
      color: rgba(255,255,255,0.2);
      text-align: center;
      max-width: 260px;
      line-height: 1.5;
    }

    /* ── Score flash ───────────────────────────────────── */
    .score-flash {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.05s;
    }

    .score-flash.good { background: rgba(255, 107, 157, 0.12); }
    .score-flash.bad  { background: rgba(255, 65, 108, 0.18); }
    .score-flash.active { opacity: 1; }

    /* ── Game over overlay ─────────────────────────────── */
    .gameover {
      position: fixed;
      inset: 0;
      background: rgba(10, 5, 5, 0.92);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s;
    }

    .gameover.show {
      opacity: 1;
      pointer-events: all;
    }

    .gameover-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      text-align: center;
      padding: 0 32px;
      animation: shakeIn 0.5s cubic-bezier(0.36, 0.07, 0.19, 0.97);
    }

    @keyframes shakeIn {
      0%  { transform: scale(0.5) rotate(-8deg); opacity: 0; }
      60% { transform: scale(1.05) rotate(3deg); opacity: 1; }
      80% { transform: scale(0.97) rotate(-1deg); }
      100%{ transform: scale(1) rotate(0deg); }
    }

    .gameover-emoji {
      font-size: 5rem;
      line-height: 1;
      animation: wobble 1s ease-in-out infinite 0.6s;
    }

    @keyframes wobble {
      0%, 100% { transform: rotate(-8deg); }
      50% { transform: rotate(8deg); }
    }

    .gameover-title {
      font-size: 3.5rem;
      font-weight: 900;
      background: linear-gradient(135deg, #ff416c, #ff4b2b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 2px;
    }

    .gameover-sub {
      font-size: 1rem;
      color: rgba(255,255,255,0.5);
    }

    .btn-restart {
      margin-top: 12px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border: none;
      padding: 16px 40px;
      border-radius: 32px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 0 30px rgba(102, 126, 234, 0.5);
      transition: transform 0.1s;
      letter-spacing: 0.5px;
    }

    .btn-restart:active { transform: scale(0.96); }
  </style>
</head>
<body>

<div class="score-flash" id="flash"></div>

<!-- Game over overlay -->
<div class="gameover" id="gameover">
  <div class="gameover-box">
    <div class="gameover-emoji">😂</div>
    <div class="gameover-title">PERDEU!</div>
    <div class="gameover-sub">Disse o último "mãe"</div>
    <button class="btn-restart" onclick="restartGame()">🎮 Jogar de novo</button>
  </div>
</div>

<div class="app">
  <!-- Mode tabs -->
  <div class="tabs">
    <button class="tab active" id="tab-counter" onclick="setMode('counter')">Contador</button>
    <button class="tab" id="tab-game" onclick="setMode('game')">Jogo 🎮</button>
  </div>

  <!-- Hearts (game mode only) -->
  <div class="hearts" id="hearts" style="display:none"></div>

  <div class="counter-wrap">
    <span class="counter mode-counter" id="counter">0</span>
  </div>
  <div class="counter-label" id="counter-label">vezes que disse "mãe" 😤</div>

  <button class="btn-main start" id="mainBtn" onclick="toggle()">
    <span class="icon">🎤</span>
    <span class="label">Iniciar</span>
  </button>

  <div class="status" id="status">Toque para começar</div>
  <div class="last-word" id="lastWord">&nbsp;</div>

  <div class="bottom">
    <button class="btn-reset" id="resetBtn" onclick="handleReset()">Zerar contador</button>
    <div class="wake-info" id="wakeInfo">Mantenha a tela ligada para funcionar melhor no iPhone</div>
  </div>
</div>

<script>
  // ── State ──────────────────────────────────────────────────────────────
  let mode = 'counter';           // 'counter' | 'game'
  const GAME_START = 10;

  let count     = parseInt(localStorage.getItem('maeCount') || '0');
  let gamePoints = GAME_START;
  let gameActive = false;         // true once user starts game mode

  let recognition = null;
  let isListening = false;
  let audioCtx    = null;
  let wakeLock    = null;
  let restartTimer = null;

  // Patterns
  const MAE_STRICT = /\bm[aã]+(?:[eêéiy]|nh[eêéiy]?)\b/gi;
  const MAE_LOOSE  = /\bm[aã]+(?:[eêéiy]|nh?[eêéiy]?)?\b/gi;

  // Init counter display
  document.getElementById('counter').textContent = count;

  // ── Audio ──────────────────────────────────────────────────────────────
  function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  // Cheerful ascending arpeggio (counter mode)
  function playScoreUp() {
    initAudio();
    [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
      const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.type = 'sine'; osc.frequency.value = f;
      const t0 = audioCtx.currentTime + i * 0.1;
      gain.gain.setValueAtTime(0, t0);
      gain.gain.linearRampToValueAtTime(0.35, t0 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.28);
      osc.start(t0); osc.stop(t0 + 0.3);
    });
    // Thwack
    const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.05, audioCtx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random()*2-1)*(1 - i/d.length);
    const src = audioCtx.createBufferSource(), ng = audioCtx.createGain();
    ng.gain.value = 0.15; src.buffer = buf;
    src.connect(ng); ng.connect(audioCtx.destination);
    src.start(audioCtx.currentTime);
  }

  // Single descending bloop (lose a point)
  function playLosePoint() {
    initAudio();
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(440, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(180, audioCtx.currentTime + 0.35);
    gain.gain.setValueAtTime(0.35, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
    osc.start(audioCtx.currentTime); osc.stop(audioCtx.currentTime + 0.4);
  }

  // Dramatic "wah wah wah waaah" defeat music
  function playGameOver() {
    initAudio();
    const notes = [
      { f: 392.00, t: 0.00, dur: 0.28 },   // G4
      { f: 349.23, t: 0.32, dur: 0.28 },   // F4
      { f: 311.13, t: 0.64, dur: 0.28 },   // Eb4
      { f: 261.63, t: 0.96, dur: 1.40 },   // C4 long
    ];
    notes.forEach(({ f, t, dur }) => {
      const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.type = 'sawtooth'; osc.frequency.value = f;
      const t0 = audioCtx.currentTime + t;
      gain.gain.setValueAtTime(0, t0);
      gain.gain.linearRampToValueAtTime(0.4, t0 + 0.04);
      gain.gain.setValueAtTime(0.4, t0 + dur * 0.8);
      gain.gain.linearRampToValueAtTime(0, t0 + dur);
      osc.start(t0); osc.stop(t0 + dur + 0.05);

      // Harmonics for brass-like timbre
      [2, 3].forEach(harmonic => {
        const h = audioCtx.createOscillator(), hg = audioCtx.createGain();
        h.connect(hg); hg.connect(audioCtx.destination);
        h.type = 'sine'; h.frequency.value = f * harmonic;
        hg.gain.setValueAtTime(0, t0);
        hg.gain.linearRampToValueAtTime(0.08 / harmonic, t0 + 0.04);
        hg.gain.setValueAtTime(0.08 / harmonic, t0 + dur * 0.8);
        hg.gain.linearRampToValueAtTime(0, t0 + dur);
        h.start(t0); h.stop(t0 + dur + 0.05);
      });
    });
  }

  // ── Scoring ────────────────────────────────────────────────────────────
  function scoreCounter(word) {
    count++;
    localStorage.setItem('maeCount', count);
    const el = document.getElementById('counter');
    el.textContent = count;
    popCounter(); ripple(false); flash(false);
    document.getElementById('lastWord').textContent = '"' + word.trim() + '" detectado';
    playScoreUp();
  }

  function scoreGame(word) {
    if (!gameActive || gamePoints <= 0) return;
    gamePoints--;
    updateHearts();
    const el = document.getElementById('counter');
    el.textContent = gamePoints;
    updateGameColor();
    popCounter(); ripple(true); flash(true);
    document.getElementById('lastWord').textContent = '"' + word.trim() + '" — ' + gamePoints + ' pontos restantes';

    if (gamePoints <= 0) {
      playGameOver();
      setTimeout(showGameOver, 600);
    } else {
      playLosePoint();
    }
  }

  function popCounter() {
    const el = document.getElementById('counter');
    el.classList.remove('pop');
    void el.offsetWidth;
    el.classList.add('pop');
    setTimeout(() => el.classList.remove('pop'), 300);
  }

  function ripple(bad) {
    const r = document.createElement('div');
    r.className = 'ripple' + (bad ? ' bad' : '');
    document.querySelector('.counter-wrap').appendChild(r);
    setTimeout(() => r.remove(), 700);
  }

  function flash(bad) {
    const el = document.getElementById('flash');
    el.className = 'score-flash ' + (bad ? 'bad' : 'good');
    el.classList.add('active');
    setTimeout(() => el.classList.remove('active'), 130);
  }

  // ── Game mode helpers ──────────────────────────────────────────────────
  function updateGameColor() {
    const el = document.getElementById('counter');
    el.classList.remove('mode-counter', 'pts-safe', 'pts-warn', 'pts-danger');
    if (gamePoints >= 6)      el.classList.add('pts-safe');
    else if (gamePoints >= 3) el.classList.add('pts-warn');
    else                      el.classList.add('pts-danger');
  }

  function updateHearts() {
    const container = document.getElementById('hearts');
    const all = container.querySelectorAll('.heart');
    // Mark hearts as lost from the right
    const lost = GAME_START - gamePoints;
    all.forEach((h, i) => {
      h.classList.toggle('lost', i >= GAME_START - lost);
    });
  }

  function buildHearts() {
    const container = document.getElementById('hearts');
    container.innerHTML = '';
    for (let i = 0; i < GAME_START; i++) {
      const h = document.createElement('span');
      h.className = 'heart';
      h.textContent = '❤️';
      container.appendChild(h);
    }
  }

  function showGameOver() {
    stopListening();
    document.getElementById('gameover').classList.add('show');
  }

  function restartGame() {
    gamePoints = GAME_START;
    gameActive = true;
    document.getElementById('gameover').classList.remove('show');
    document.getElementById('counter').textContent = GAME_START;
    updateGameColor();
    buildHearts();
    document.getElementById('lastWord').textContent = ' ';
    startListening();
  }

  // ── Mode switch ────────────────────────────────────────────────────────
  function setMode(m) {
    if (isListening) stopListening();
    mode = m;

    document.getElementById('tab-counter').classList.toggle('active', m === 'counter');
    document.getElementById('tab-game').classList.toggle('active', m === 'game');

    const counterEl = document.getElementById('counter');
    const heartsEl  = document.getElementById('hearts');
    const label     = document.getElementById('counter-label');
    const resetBtn  = document.getElementById('resetBtn');

    if (m === 'counter') {
      counterEl.className = 'counter mode-counter';
      counterEl.textContent = count;
      heartsEl.style.display = 'none';
      label.textContent = 'vezes que disse "mãe" 😤';
      resetBtn.textContent = 'Zerar contador';
      gameActive = false;
    } else {
      gamePoints = GAME_START;
      gameActive = true;
      counterEl.className = 'counter';
      counterEl.textContent = GAME_START;
      updateGameColor();
      heartsEl.style.display = 'flex';
      buildHearts();
      label.textContent = 'pontos restantes — não diga mãe! 💀';
      resetBtn.textContent = 'Reiniciar jogo';
    }

    document.getElementById('lastWord').textContent = ' ';
    document.getElementById('status').textContent = 'Toque para começar';
    document.getElementById('mainBtn').className = 'btn-main start';
    document.getElementById('mainBtn').innerHTML = '<span class="icon">🎤</span><span class="label">Iniciar</span>';
  }

  function handleReset() {
    if (mode === 'counter') {
      count = 0;
      localStorage.setItem('maeCount', 0);
      document.getElementById('counter').textContent = 0;
    } else {
      gamePoints = GAME_START;
      gameActive = true;
      document.getElementById('counter').textContent = GAME_START;
      updateGameColor();
      buildHearts();
    }
    document.getElementById('lastWord').textContent = ' ';
  }

  // ── Speech Recognition ─────────────────────────────────────────────────
  function buildRecognition() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return null;

    const r = new SR();
    r.lang = 'pt-BR';
    r.continuous = true;
    r.interimResults = true;
    r.maxAlternatives = 3;

    let interimScored = 0;

    r.onresult = (e) => {
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const result = e.results[i];
        // Best alternative only — using all alternatives triple-counts the same word
        const text = ' ' + result[0].transcript;

        if (!result.isFinal) {
          const hits = text.match(MAE_STRICT);
          const newTotal = hits ? hits.length : 0;
          if (newTotal > interimScored) {
            for (let k = interimScored; k < newTotal; k++) {
              mode === 'game' ? scoreGame(hits[k]) : scoreCounter(hits[k]);
            }
            interimScored = newTotal;
          }
        } else {
          const hits = text.match(MAE_LOOSE);
          const finalTotal = hits ? hits.length : 0;
          for (let k = interimScored; k < finalTotal; k++) {
            mode === 'game' ? scoreGame(hits[k]) : scoreCounter(hits[k]);
          }
          interimScored = 0;
        }
      }
    };

    r.onerror = (e) => {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
        setStatus('❌ Permissão de microfone negada', false);
        stopListening();
      }
    };

    r.onend = () => {
      interimScored = 0;
      if (isListening) {
        clearTimeout(restartTimer);
        restartTimer = setTimeout(() => {
          try { recognition && recognition.start(); } catch (_) {}
        }, 300);
      }
    };

    return r;
  }

  // ── Wake Lock ──────────────────────────────────────────────────────────
  async function acquireWakeLock() {
    if (!('wakeLock' in navigator)) return;
    try {
      wakeLock = await navigator.wakeLock.request('screen');
      document.getElementById('wakeInfo').textContent = 'Tela travada — não vai apagar enquanto estiver ouvindo ✓';
    } catch (_) {}
  }

  function releaseWakeLock() {
    if (wakeLock) { wakeLock.release(); wakeLock = null; }
    document.getElementById('wakeInfo').textContent = 'Mantenha a tela ligada para funcionar melhor no iPhone';
  }

  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState === 'visible' && isListening) {
      await acquireWakeLock();
      try { recognition && recognition.start(); } catch (_) {}
    }
  });

  // ── UI helpers ─────────────────────────────────────────────────────────
  function setStatus(text, listening) {
    const el = document.getElementById('status');
    el.innerHTML = listening ? '<span class="dot"></span> Ouvindo...' : text;
  }

  // ── Toggle ─────────────────────────────────────────────────────────────
  async function toggle() {
    initAudio();
    isListening ? stopListening() : await startListening();
  }

  async function startListening() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { setStatus('❌ Navegador não suporta reconhecimento de voz', false); return; }
    recognition = buildRecognition();
    isListening = true;
    try { recognition.start(); } catch (_) {}
    await acquireWakeLock();
    const btn = document.getElementById('mainBtn');
    btn.className = 'btn-main stop';
    btn.innerHTML = '<span class="icon">⏹</span><span class="label">Parar</span>';
    setStatus('', true);
  }

  function stopListening() {
    isListening = false;
    clearTimeout(restartTimer);
    if (recognition) { try { recognition.stop(); } catch (_) {} recognition = null; }
    releaseWakeLock();
    const btn = document.getElementById('mainBtn');
    btn.className = 'btn-main start';
    btn.innerHTML = '<span class="icon">🎤</span><span class="label">Iniciar</span>';
    setStatus('Toque para começar', false);
  }
</script>
</body>
</html>
